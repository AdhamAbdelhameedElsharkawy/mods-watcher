trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  solution: 'ModsWatcher/ModsWatcher.slnx'

steps:
  - checkout: self
    fetchDepth: 0  # Sonar docs: disable shallow fetch

  - task: UseDotNet@2
    displayName: 'Install .NET 10 SDK'
    inputs:
      packageType: 'sdk'
      version: '10.0.x'

  - task: SonarCloudPrepare@4.2.6
    displayName: 'Sonar: prepare analysis'
    inputs:
      SonarCloud: 'sonarcloud-mods-watcher'            # Azure DevOps service connection name (you create it)
      organization: 'adhamabdelhameedelsharkawy'
      scannerMode: 'dotnet'
      projectKey: 'AdhamAbdelhameedElsharkawy_mods-watcher'
      # Coverage import (opencover) - see note in hand-over, not yet verified against docs
      extraProperties: |
        sonar.cs.opencover.reportsPaths=$(Agent.TempDirectory)/**/coverage.opencover.xml

  - task: DotNetCoreCLI@2
    displayName: 'Build'
    inputs:
      command: 'build'
      projects: '$(solution)'
      arguments: '-c $(buildConfiguration)'

  - task: DotNetCoreCLI@2
    displayName: 'Test + coverage (coverlet.collector)'
    inputs:
      command: 'test'
      projects: 'ModsWatcher/ModsWatcher.Tests/ModsWatcher.Tests.csproj'
      arguments: '-c $(buildConfiguration) --no-build --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover'

  - task: SonarCloudAnalyze@4.2.6
    displayName: 'Sonar: run analysis'
    inputs:
      jdkversion: 'JAVA_HOME_21_X64'  # docs: Java 17 support removed

  - task: SonarCloudPublish@4.2.6
    displayName: 'Sonar: publish quality gate result'
    inputs:
      pollingTimeoutSec: '300'
